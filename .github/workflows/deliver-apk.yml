name: Validate and deliver mobile GPU fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deliver-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  validate-and-deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIDEWATER_PLAYWRIGHT_MODULE: /tmp/tidewater-test-runtime/node_modules/playwright
      TIDEWATER_GPU_OUTPUT: gpu-diagnostics
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 881ed80acf4773af2800bf93268d1a2eb3751072
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: tidewater-android-verification
          path: deliverables
          run-id: 39625809050
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: android-16-installation
          path: install-evidence
          run-id: 39625809050
          github-token: ${{ github.token }}
      - name: Verify and extract the exact already-installed APK
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          apk = pathlib.Path('deliverables/Tidewater.apk').read_bytes()
          assert len(apk) == 53314613
          assert hashlib.sha256(apk).hexdigest() == '521cff27875f93fd4c5e51e6d89d872f7167d2da495452b8ec4369448b927784'
          report = json.loads(pathlib.Path('deliverables/build-report.json').read_text())
          assert report['version'] == '0.1.1' and report['apkSignatureVerified']
          assert report['allUpstreamAssetsVerifiedInsideApk']
          installed = json.loads(pathlib.Path('install-evidence/installation.json').read_text())
          assert 'Success' in installed['install'] and 'Status: ok' in installed['launch']
          assert installed['pid'] and not installed['crashLog'].strip()
          target = pathlib.Path('upstream/dist')
          target.mkdir(parents=True, exist_ok=True)
          import io
          with zipfile.ZipFile(io.BytesIO(apk)) as archive:
              for name in archive.namelist():
                  if name.startswith('assets/game/') and not name.endswith('/'):
                      relative = pathlib.PurePosixPath(name[len('assets/game/'):])
                      assert not relative.is_absolute() and '..' not in relative.parts
                      dest = target.joinpath(*relative.parts)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(archive.read(name))
          print('Exact APK and Android 16 installation proof verified; all test content comes from this APK.')
          PY
      - name: Install browser and Mesa software Vulkan
        run: |
          npm install --ignore-scripts --prefix /tmp/tidewater-test-runtime playwright@1.62.1
          node /tmp/tidewater-test-runtime/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y mesa-vulkan-drivers
          python3 - <<'PY'
          import glob, os, pathlib
          candidates = glob.glob('/usr/share/vulkan/icd.d/*lvp*.json')
          assert candidates, 'Mesa lavapipe Vulkan ICD is required'
          runtime = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tidewater-xdg'
          runtime.mkdir(mode=0o700, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('VK_ICD_FILENAMES=' + candidates[0] + '\n')
              environment.write('VK_DRIVER_FILES=' + candidates[0] + '\n')
              environment.write('XDG_RUNTIME_DIR=' + str(runtime) + '\n')
          script = pathlib.Path('tests/gpu-startup.mjs')
          text = script.read_text()
          assert text.count("'--use-angle=swiftshader'") == 1
          text = text.replace("'--use-angle=swiftshader'", "'--use-angle=vulkan', '--use-vulkan=native', '--enable-features=Vulkan,VulkanFromANGLE,DefaultANGLEVulkan', '--disable-vulkan-surface', '--ignore-gpu-blocklist'")
          script.write_text(text)
          print('Using Mesa Vulkan:', candidates[0])
          PY
      - name: Run complete game from the actual APK with 16 sampled and 4 storage textures
        run: node tests/gpu-startup.mjs
      - name: Preserve actual APK rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-apk-vulkan-diagnostics
          path: gpu-diagnostics/
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish only after actual APK rendering passes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, runpy
          os.environ['GITHUB_SHA'] = '881ed80acf4773af2800bf93268d1a2eb3751072'
          runpy.run_path('scripts/release-apk.py', run_name='__main__')
          PY
