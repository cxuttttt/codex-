name: Build Tidewater Android

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/deliver-apk.yml'
      - 'scripts/publish-apk.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tidewater-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TIDEWATER_PLAYWRIGHT_MODULE: /tmp/tidewater-test-runtime/node_modules/playwright
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/prepare-upstream.mjs
      - run: npm ci
        working-directory: upstream
      - name: Install browser for actual WebGPU regression
        run: |
          npm install --ignore-scripts --prefix /tmp/tidewater-test-runtime playwright@1.62.1
          node /tmp/tidewater-test-runtime/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify complete game startup with the fixed 16-texture bindings
        env:
          TIDEWATER_GPU_OUTPUT: gpu-diagnostics/after
        run: |
          node scripts/check-mobile.mjs
          npm run build --prefix upstream
          node tests/gpu-startup.mjs
      - name: Save actual WebGPU screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-16-texture-regression
          path: gpu-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preserve verification APK signing key across builds
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tidewater-verification-debug.keystore
          key: tidewater-verification-debug-key-v2
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false
      - name: Ensure Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch pinned upstream and prepare mobile build
        run: node scripts/prepare-upstream.mjs
      - name: Install upstream dependencies
        working-directory: upstream
        run: npm ci
      - name: Check mobile code and upstream game logic
        run: node scripts/check-mobile.mjs
      - name: Build and bundle the complete game
        run: node scripts/bundle.mjs
      - name: Prepare stable verification signing key
        run: |
          if [ ! -f "$RUNNER_TEMP/tidewater-verification-debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/tidewater-verification-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Tidewater Verification,O=Local Development,C=CN'
          fi
      - name: Compile Android verification APK
        working-directory: android
        env:
          TIDEWATER_VERIFICATION_KEYSTORE: ${{ runner.temp }}/tidewater-verification-debug.keystore
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Verify packaged resources and record SHA256
        run: python3 scripts/verify-apk.py
      - name: Upload APK and build report
        uses: actions/upload-artifact@v4
        with:
          name: tidewater-android-verification
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  android-install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: tidewater-android-verification
          path: deliverables
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Install and launch the actual APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 scripts/check-apk-install.py
      - name: Save APK installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-16-installation
          path: install-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

  release:
    needs: [build, gpu-regression, android-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tidewater-android-verification
          path: deliverables
      - name: Publish only after rendering and installation checks pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release-apk.py
