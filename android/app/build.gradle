plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.sencao.tidewater'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.sencao.tidewater.verification'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '0.1.1-verification'
    }

    def verificationKey = System.getenv('TIDEWATER_VERIFICATION_KEYSTORE')
    if (verificationKey) {
        signingConfigs {
            debug {
                storeFile file(verificationKey)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
