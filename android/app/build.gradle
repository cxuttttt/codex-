plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.sencao.tidewater'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.sencao.tidewater.verification'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1.0-verification'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
